{% extends "yyj/base.html" %}

{% block title %}数据获取方法{% endblock %}

{% block content %}
<div class="ui basic segment">
    <h2 class="ui pink header">卡司表获取方法</h2>
    关注制作公司、剧院微信公众号或微博，获取最新开票信息，发给AI处理排期表。<br>
    <h2 class="ui pink header">演出信息获取方法</h2>
    1. 剧院、院线、制作公司微信公众号或微博<br>
    2. 大麦官网，分类→全国→话剧歌剧→音乐剧<br>
    3. 保利票务官网，全国→音乐剧<br>
    4. 猫眼演出官网，搜索"音乐剧"<br>
    5. 戏剧日历小程序、各地音乐剧bot、小红书推送<br>
</div>
{% endblock %}
