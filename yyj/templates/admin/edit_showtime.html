{% extends "admin/base_site.html" %}

{% block content %}
<form method="post">
    {% csrf_token %}
    <p>
        Schedule ID<br>
        <input type="text" name="schedule_id" required>
    </p>
    <p>
        原演出时间（格式：X月X日 HH:MM 或 YYYY年X月X日 HH:MM，日和时之间可含星期几）<br>
        <input type="text" name="old_time_str" required>
    </p>
    <p>
        新演出时间（格式：X月X日 HH:MM 或 YYYY年X月X日 HH:MM，日和时之间可含星期几）<br>
        <input type="text" name="new_time_str" required>
    </p>
    <button type="submit">执行</button>
</form>
{% if result %}
<h2>执行结果</h2>
<pre>{{ result }}</pre>
{% endif %}
{% endblock %}
